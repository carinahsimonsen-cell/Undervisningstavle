<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassens kalender – Undervisningstavlen</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#25332b;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{width:100%;max-width:1760px;margin:auto;padding:22px clamp(14px,2.4vw,48px) 50px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}header h1{font-size:clamp(23px,5vw,32px);line-height:1.1;margin:0 0 6px}header p{margin:0;color:#6b756d}.cal-icon{font-size:34px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:#fff;padding:14px;border:1px solid #e1e6df;border-radius:16px}.filters label{flex:1;min-width:150px;font-size:13px;font-weight:650}select,input{font:inherit;width:100%;padding:10px;border:1px solid #cad4c9;border-radius:9px;background:#fff;color:#25332b;margin-top:5px}.tabs{display:flex;gap:4px;flex:1;min-width:225px;background:#f2f5f1;border-radius:10px;padding:4px}.tabs button{flex:1;border:0;border-radius:8px;background:transparent;padding:10px 6px;font:inherit;font-weight:650;cursor:pointer}.tabs button.active{background:#e2ede6;box-shadow:0 1px 3px #0001}.tabs button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.tabs .homework-hint{display:block;font-size:12px;line-height:1.35;font-weight:600;color:#48634e}.tabs .homework-hint:empty{display:none}
.day.past-due h2,.day.past-due .subject,.day.past-due .homework,.day.past-due .homework strong{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#78857e}.day.past-due h2{color:#7d8780}.day.past-due .entry{background:#f8f9f7;border-color:#e6e9e4;border-left-color:#c5ccc6}.day.past-due .subject{opacity:.55}.day.past-due .homework{color:#7c857d;background:#f1f3ef}
.day{margin-top:23px}.day-entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;align-items:stretch}.day-entries .entry{margin-bottom:0}.day h2{font-size:17px;font-weight:750;margin:0 0 10px;text-transform:capitalize}.entry{background:#fff;border:1px solid #e0e6df;border-left:6px solid var(--subject-color,#a0ada5);border-radius:12px;padding:15px;margin-bottom:9px;white-space:normal}.subject{display:inline-block;font-size:15px;font-weight:750;padding:5px 12px;border-radius:8px;margin-bottom:11px}.bodytext{white-space:pre-line}.homework{margin-top:10px;padding:11px 12px;background:#f3f5ef;border-radius:9px;white-space:pre-line}.materials{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.material{padding:7px 10px;color:#234e6b;background:#eff5f8;border-radius:7px;text-decoration:none;font-size:14px;overflow-wrap:anywhere}.material:hover{text-decoration:underline}.subtoolbar,.date-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.subtoolbar button,.date-nav button{background:#fff;border:1px solid #cad4c9;border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit}.date-nav label{font-size:13px;font-weight:600;max-width:200px}.notice{padding:18px;border:1px solid #e1e6df;background:#fff;border-radius:12px;margin-top:20px;color:#5a675e}footer{margin-top:35px;font-size:12px;color:#758078}.flash{outline:2px solid #4f8460;outline-offset:6px;border-radius:6px}
@media(max-width:700px){main{padding:14px 12px 40px}.filters{display:block}.tabs{margin-top:13px}.day-entries{grid-template-columns:1fr}.entry{padding:12px}.cal-icon{font-size:25px}}

/* Administration er kun tilgængelig via den særskilte læreradresse og kræver Firebase-login. */
.teacher-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.teacher-header button,.teacher-actions button{border:1px solid #becdc3;border-radius:8px;background:#fff;padding:8px 11px;font:inherit;cursor:pointer}.teacher-ready{font-size:13px;font-weight:700;color:#386044;background:#e6f2e7;padding:8px 11px;border-radius:8px}.teacher-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #e6ebe7}.teacher-actions button{font-size:13px;font-weight:700}.teacher-actions .danger{color:#953d38;border-color:#e4c7c4}
.elevcal-teacher-backdrop{position:fixed;inset:0;z-index:50000;background:#15231cb0;display:grid;place-items:center;padding:12px}.elevcal-teacher-dialog{width:min(720px,100%);max-height:94vh;overflow-y:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 12px 50px #12241d70}.elevcal-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.elevcal-dialog-head h2{margin:0}.ec-admin-form{display:grid;gap:15px;margin-top:15px}.ec-admin-form label{display:grid;gap:5px;font-weight:650;font-size:14px}.ec-admin-form input,.ec-admin-form textarea{width:100%;margin:0;border:1px solid #b8cabe;border-radius:8px;padding:10px;font:inherit}.ec-admin-form textarea{resize:vertical}.ec-muted{color:#617568;font-size:13px}.ec-section{border-top:1px solid #e2e8e2;padding-top:10px}.ec-section h3{margin:0 0 9px;font-size:16px}.ec-material-row{display:grid;grid-template-columns:1fr 1.7fr auto;gap:7px;margin:8px 0;align-items:center}.ec-secondary,.ec-primary{border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}.ec-secondary{border:1px solid #c4d2c8;background:#fff;color:#2d4134}.ec-primary{background:#386b4b;color:#fff;border:1px solid #386b4b}.ec-primary:disabled{opacity:.55}.ec-actions{display:flex;flex-wrap:wrap;gap:8px}.ec-admin-msg{color:#873f30;margin:0;font-size:14px}
@media(max-width:600px){.elevcal-teacher-dialog{padding:14px}.ec-material-row{grid-template-columns:1fr}.elevcal-dialog-head{align-items:flex-start}}
</style>
</head>
<body><main id="studentApp"><div class="notice">Henter klassens kalender …</div></main>
<script type="module">
import {studentCalendar} from './elevkalender-app.js';
studentCalendar().catch(e=>{const root=document.getElementById('studentApp');root.textContent='Kalenderen kunne ikke indlæses. Prøv at genindlæse siden.';console.error(e)});
</script></body></html>
