<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassens kalender – Undervisningstavlen</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#25332b;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{max-width:900px;margin:auto;padding:22px 15px 50px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}header h1{font-size:clamp(23px,5vw,32px);line-height:1.1;margin:0 0 6px}header p{margin:0;color:#6b756d}.cal-icon{font-size:34px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:#fff;padding:14px;border:1px solid #e1e6df;border-radius:16px}.filters label{flex:1;min-width:170px;font-size:13px;font-weight:650}select,input{font:inherit;width:100%;padding:10px;border:1px solid #cad4c9;border-radius:9px;background:#fff;color:#25332b;margin-top:5px}.tabs{display:flex;gap:4px;flex:1;min-width:225px;background:#f2f5f1;border-radius:10px;padding:4px}.tabs button{flex:1;border:0;border-radius:8px;background:transparent;padding:10px 6px;font:inherit;font-weight:650;cursor:pointer}.tabs button.active{background:#e2ede6;box-shadow:0 1px 3px #0001}
.day{margin-top:23px}.day h2{font-size:17px;font-weight:750;margin:0 0 10px;text-transform:capitalize}.entry{background:#fff;border:1px solid #e0e6df;border-radius:12px;padding:15px;margin-bottom:9px;white-space:normal}.subject{display:inline-block;font-size:13px;font-weight:750;padding:3px 10px;border-radius:8px;margin-bottom:9px}.bodytext{white-space:pre-line}.homework{margin-top:10px;padding:11px 12px;background:#f3f5ef;border-radius:9px;white-space:pre-line}.materials{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.material{padding:7px 10px;color:#234e6b;background:#eff5f8;border-radius:7px;text-decoration:none;font-size:14px;overflow-wrap:anywhere}.material:hover{text-decoration:underline}.subtoolbar,.date-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.subtoolbar button,.date-nav button{background:#fff;border:1px solid #cad4c9;border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit}.date-nav label{font-size:13px;font-weight:600;max-width:200px}.notice{padding:18px;border:1px solid #e1e6df;background:#fff;border-radius:12px;margin-top:20px;color:#5a675e}footer{margin-top:35px;font-size:12px;color:#758078}.flash{outline:2px solid #4f8460;outline-offset:6px;border-radius:6px}
@media(max-width:500px){main{padding:14px 10px 40px}.filters{display:block}.tabs{margin-top:13px}.entry{padding:12px}.cal-icon{font-size:25px}}
</style>
</head>
<body><main id="studentApp"><div class="notice">Henter klassens kalender …</div></main>
<script type="module">
import {studentCalendar} from './elevkalender-app.js';
studentCalendar().catch(e=>{const root=document.getElementById('studentApp');root.textContent='Kalenderen kunne ikke indlæses. Prøv at genindlæse siden.';console.error(e)});
</script></body></html>
